# AVM Demo - Docker Compose (V1.53 生产化版)
# 启动: docker compose up -d --build
# 访问: http://localhost:8080
#  - 8080 → 前端 (nginx:80，含 /api 和 /api/ws 反代)
#
# 首次部署:
#   1. 复制 .env.example 为 .env，修改 POSTGRES_PASSWORD / CORS_ORIGIN / API_KEY_ENCRYPTION_KEY
#   2. docker compose up -d --build
#   3. docker compose exec backend npx tsx src/seed.ts  (导入演示数据)

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: avm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: avm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, set it in .env}
      POSTGRES_DB: avm
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avm -d avm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    container_name: avm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://avm:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/avm?schema=public"
      TOKEN_TTL_HOURS: ${TOKEN_TTL_HOURS:-168}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN}
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ENABLE_CSRF_PROTECTION: ${ENABLE_CSRF_PROTECTION:-false}
      PRISMA_CONNECTION_LIMIT: ${PRISMA_CONNECTION_LIMIT:-10}
      SLOW_QUERY_MS: ${SLOW_QUERY_MS:-500}
    volumes:
      - avm-uploads:/app/uploads
      - avm-logs:/app/logs
    expose:
      - "4000"
      - "4001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
        VITE_WS_PORT: ""
    container_name: avm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

  backup:
    image: postgres:16-alpine
    container_name: avm-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - postgres-data:/var/lib/postgresql/data:ro
      - avm-backups:/backups
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "🗄️  AVM backup service started, waiting for first run at 03:00 UTC..."
        while true; do
          NOW=$$(date +%H%M)
          if [ "$$NOW" = "0300" ]; then
            TS=$$(date +%Y%m%d_%H%M%S)
            echo "[$$(date)] Running backup..."
            pg_dump -h postgres -U avm -d avm -F c -f /backups/avm_$$TS.dump
            echo "[$$(date)] Backup done: avm_$$TS.dump"
            find /backups -name "avm_*.dump" -mtime +$${BACKUP_KEEP_DAYS} -delete
            echo "[$$(date)] Cleaned backups older than $${BACKUP_KEEP_DAYS} days"
            sleep 60
          fi
          sleep 30
        done

volumes:
  postgres-data:
    driver: local
  avm-uploads:
    driver: local
  avm-backups:
    driver: local
  avm-logs:
    driver: local
